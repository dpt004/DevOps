services:
  - type: web
    name: attendance-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: true
      - key: DB_SSL_CA_BASE64
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL_SECONDS
        value: 28800
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_TEACHER_PASSWORD
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false
